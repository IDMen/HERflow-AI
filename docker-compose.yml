services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/herflow
    ports: ["3000:3000"]
    depends_on: [mongo]
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["4200:80"]
    depends_on: [backend]
volumes:
  mongo_data:
